display_information:
  name: Norrsken Wi-Fi
  description: Anonymous network problem reports for Norrsken House
  background_color: "#0a0a0a"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Norrsken Wi-Fi
    always_online: true
  shortcuts:
    - name: Report a network problem
      type: global
      callback_id: wifi_report
      description: Tap through a short anonymous report
  slash_commands:
    - command: /wifi
      description: Report a network problem
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:history
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
